[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tighnet"
version = "0.1.0"
description = "Intelligent MIDI quantization using learned onset correction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "mido>=1.3",
    "numpy>=1.24",
    "coremltools>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools]
packages = ["tighnet"]

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-dir = "./.uv_cache"